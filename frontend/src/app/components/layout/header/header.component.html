<header class="header-container">
  <div class="header-left">
    <span class="path-breadcrumbs">{{ currentRoutePath }}</span>
  </div>

  <div class="header-right">
    <div class="lang-switcher">
      <button 
        type="button" 
        class="lang-btn" 
        [class.active]="currentLang() === 'pl'" 
        (click)="setLang('pl')">
        PL
      </button>
      <span class="divider">|</span>
      <button 
        type="button" 
        class="lang-btn" 
        [class.active]="currentLang() === 'en'" 
        (click)="setLang('en')">
        EN
      </button>
    </div>

    <div class="header-actions">
      <a [href]="profile().githubUrl || 'https://github.com/unatco1994p-afk/portfolio'" target="_blank" [title]="currentLang() === 'pl' ? 'GitHub (Kod źródłowy projektu)' : 'GitHub (Project repository)'" class="action-btn">
        <span class="material-symbols-outlined">code</span>
      </a>
      <span class="action-btn disabled" [title]="currentLang() === 'pl' ? 'LinkedIn - Wkrótce dostępne' : 'LinkedIn - Not available yet'">
        <span class="material-symbols-outlined">link</span>
      </span>
      <div class="user-avatar" [title]="profile().name || 'Tomasz Zwierzyński'">
        <img src="assets/photo.jpg" [alt]="profile().name || 'Tomasz Zwierzyński'" />
      </div>
    </div>
  </div>
</header>
