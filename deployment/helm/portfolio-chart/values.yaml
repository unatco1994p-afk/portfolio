# Default values for portfolio-chart

global:
  domain: "portfolio.example.com"
  staticIpName: "portfolio-static-ip"

frontend:
  replicaCount: 2
  image:
    repository: "europe-west3-docker.pkg.dev/YOUR_PROJECT_ID/portfolio/portfolio-frontend"
    tag: "latest"
    pullPolicy: Always
  service:
    type: NodePort
    port: 80
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

backend:
  replicaCount: 2
  image:
    repository: "europe-west3-docker.pkg.dev/YOUR_PROJECT_ID/portfolio/portfolio-backend"
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  env:
    quarkusCorsOrigins: "https://portfolio.example.com"

ingress:
  enabled: true
  className: "gce"
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "portfolio-managed-cert"
  staticIpName: "portfolio-static-ip"

ssl:
  managedCertificate:
    enabled: true
    name: "portfolio-managed-cert"
    domains:
      - "portfolio.example.com"
